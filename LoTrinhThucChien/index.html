<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lộ Trình Học AI/ML Thực Chiến</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #4CAF50;
        }
        p.subtitle {
            text-align: center;
            font-size: 1.1em;
            color: #b0bec5;
        }
        #mynetwork {
            width: 100%;
            height: 700px;
            border: 2px solid #33334d;
            border-radius: 10px;
            background-color: #2b2b40;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🚀 Lộ Trình Học AI & Machine Learning Thực Chiến</h1>
    <p class="subtitle">Sơ đồ tương tác thể hiện mối liên hệ giữa các phần học (Toán, Python, Dữ liệu, Học máy, AI)</p>

    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background-color: #ff9800;"></div> Phần 1: Nền tảng Python & Toán</div>
        <div class="legend-item"><div class="color-box" style="background-color: #2196f3;"></div> Phần 2: Data Science</div>
        <div class="legend-item"><div class="color-box" style="background-color: #4caf50;"></div> Phần 3: Machine Learning</div>
        <div class="legend-item"><div class="color-box" style="background-color: #e91e63;"></div> Phần 4: Deep Learning & AI</div>
    </div>

    <div id="mynetwork"></div>

    <script type="text/javascript">
        // Khởi tạo Nodes (Các bài học/Chủ đề)
        var nodes = new vis.DataSet([
            {id: 1, label: 'Python Cơ Bản\n(Biến, Vòng lặp, Hàm)', group: 'phase1', shape: 'box'},
            {id: 2, label: 'Đại số Tuyến tính\n(Ma trận, Vector)', group: 'phase1', shape: 'ellipse'},
            {id: 3, label: 'Giải tích\n(Đạo hàm)', group: 'phase1', shape: 'ellipse'},

            {id: 4, label: 'NumPy\n(Tính toán Mảng)', group: 'phase2', shape: 'box'},
            {id: 5, label: 'Pandas\n(Xử lý Bảng Dữ liệu)', group: 'phase2', shape: 'box'},
            {id: 6, label: 'Làm sạch Dữ liệu\n(Data Cleaning)', group: 'phase2', shape: 'box'},

            {id: 7, label: 'Hồi quy Tuyến tính\n(Linear Regression)', group: 'phase3', shape: 'diamond'},
            {id: 8, label: 'Gradient Descent\n(Tối ưu hóa)', group: 'phase3', shape: 'diamond'},
            {id: 9, label: 'Phân loại\n(Classification / Trees)', group: 'phase3', shape: 'diamond'},

            {id: 10, label: 'Mạng Nơ-ron\n(Neural Networks)', group: 'phase4', shape: 'star'},
            {id: 11, label: 'Thị giác Máy tính\n(CNN / Image Padding)', group: 'phase4', shape: 'star'},
            {id: 12, label: 'Xử lý Ngôn ngữ Tự nhiên\n(Transformers & LLMs)', group: 'phase4', shape: 'star'},
            {id: 13, label: 'Agentic RAG\n(Tối ưu LLM thực chiến)', group: 'phase4', shape: 'star'},
        ]);

        // Khởi tạo Edges (Mối liên hệ)
        var edges = new vis.DataSet([
            // Từ Python sang các thư viện
            {from: 1, to: 4, arrows: 'to', label: 'Cơ sở code', dashes: true},
            {from: 1, to: 5, arrows: 'to', label: 'Cơ sở code', dashes: true},

            // Từ Toán sang Thuật toán/Thư viện
            {from: 2, to: 4, arrows: 'to', label: 'Thực hành Ma trận trên NumPy'},
            {from: 3, to: 8, arrows: 'to', label: 'Ứng dụng Đạo hàm để tìm cực tiểu'},

            // Từ Data sang ML
            {from: 4, to: 7, arrows: 'to', label: 'Cung cấp mảng số'},
            {from: 5, to: 6, arrows: 'to', label: 'Tiền xử lý'},
            {from: 6, to: 7, arrows: 'to', label: 'Dữ liệu sạch cho Model'},
            {from: 6, to: 9, arrows: 'to', label: 'Dữ liệu sạch cho Model'},

            // Thuật toán ML
            {from: 8, to: 7, arrows: 'to', label: 'Giải thuật tối ưu (Loss Function)'},

            // Từ ML sang DL
            {from: 2, to: 10, arrows: 'to', label: 'Nhân ma trận liên tục'},
            {from: 8, to: 10, arrows: 'to', label: 'Backpropagation'},
            {from: 7, to: 10, arrows: 'to', label: 'Nền tảng của Nơ-ron'},

            // Nhánh AI cụ thể
            {from: 10, to: 11, arrows: 'to', label: 'Xử lý ảnh'},
            {from: 10, to: 12, arrows: 'to', label: 'Xử lý văn bản'},
            {from: 12, to: 13, arrows: 'to', label: 'Nâng cấp mô hình với Dữ liệu ngoài'},
        ]);

        var container = document.getElementById('mynetwork');
        var data = {
            nodes: nodes,
            edges: edges
        };
        var options = {
            groups: {
                phase1: {color:{background:'#ff9800', border:'#e65100'}, font:{color:'white'}},
                phase2: {color:{background:'#2196f3', border:'#0d47a1'}, font:{color:'white'}},
                phase3: {color:{background:'#4caf50', border:'#1b5e20'}, font:{color:'white'}},
                phase4: {color:{background:'#e91e63', border:'#880e4f'}, font:{color:'white'}}
            },
            physics: {
                stabilization: false,
                barnesHut: {
                    springLength: 200,
                    springConstant: 0.05
                }
            },
            edges: {
                font: {
                    size: 12,
                    color: '#b0bec5',
                    strokeWidth: 0,
                    align: 'middle'
                },
                color: {
                    color: '#848484',
                    highlight: '#ffffff',
                },
                smooth: {
                    type: 'curvedCW',
                    roundness: 0.2
                }
            },
            nodes: {
                font: {
                    size: 16,
                    face: 'Segoe UI'
                },
                shadow: true
            },
            interaction: {
                hover: true,
                tooltipDelay: 200
            }
        };
        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
