        .phase:hover { border-color: #3a3a55; }
        .phase-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; cursor: pointer; }

        .phase-title .num { opacity: 0.5; margin-right: 8px; }
        .phase-count { font-size: 0.8em; color: #888; background: #1e1e36; padding: 4px 12px; border-radius: 20px; }

        .topic { padding: 10px 14px; margin: 6px 0; border-radius: 10px; background: #1c1c34; border-left: 3px solid #333; transition: all 0.2s; }
        .topic.hidden { display: none; }
        .topic:hover { background: #22223c; }
        .topic.done { border-left-color: #00e676; opacity: 0.7; }
        .topic.done .topic-label { text-decoration: line-through; }

        .topic-main { display: flex; align-items: center; cursor: pointer; }
        .topic-check { width: 18px; height: 18px; border-radius: 4px; border: 2px solid #555; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-right: 14px; flex-shrink: 0; transition: all 0.2s; font-size: 11px; color: transparent; }

        .topic-label { flex: 1; font-size: 0.9em; font-weight: 500; }
        .topic-tag { font-size: 0.7em; padding: 2px 8px; border-radius: 12px; background: #2a2a44; color: #999; margin-left: 8px; flex-shrink: 0; }
        .topic-goal { font-size: 0.75em; color: #777; margin-left: 12px; text-align: right; flex-shrink: 0; }
        .topic-arrow { font-size: 0.7em; color: #555; margin-left: 10px; transition: transform 0.2s; flex-shrink: 0; }
        .topic-arrow.open { transform: rotate(180deg); }

        .topic-files { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .topic-files.open { max-height: 300px; }
        .topic-files ul { list-style: none; padding: 8px 0 4px 32px; }
        .topic-files li { font-size: 0.78em; color: #888; padding: 3px 0; font-family: 'Courier New', monospace; }
        .topic-files li::before { content: '\2192'; color: #00bcd4; margin-right: 6px; }

        .phase2 .topic { border-left-color: #0d47a1; }
        .phase3 .topic { border-left-color: #1b5e20; }
        .phase4 .topic { border-left-color: #880e4f; }
        .phase1 .topic.done { border-left-color: #ff9800; }

        .phase3 .topic.done { border-left-color: #4caf50; }

        .phase3 { border-left: 4px solid #4caf50; }
        .phase4 { border-left: 4px solid #e91e63; }

                      files: [
                        'LLMs-and-GenAI/RAG-and-Retrieval/Retrieval-Augmented Generation Python Practical Examples.md',
                        'LLMs-and-GenAI/Agents-and-LangChain/Leveraging LangChain FAISS and CTransformers in Python.md',
                        'Web-and-APIs/Integrating ML Models in FastAPI with Python.md'
                      ]}
                ]
            }
        ];

        const STORAGE_KEY = 'ml_roadmap_checks';

        function loadState() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
        }

        function saveState(state) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function toggleCheck(id) {
            const state = loadState();
            state[id] = !state[id];
            saveState(state);
            renderRoadmap();
        }

        function toggleFiles(id) {
            const el = document.getElementById('files-' + id);
            const arrow = document.getElementById('arrow-' + id);
            if (el) {
                el.classList.toggle('open');
                if (arrow) arrow.classList.toggle('open');
            }
        }

        function filterTopics(query) {
            const q = query.toLowerCase().trim();
            document.querySelectorAll('.topic').forEach(t => {
                const text = t.textContent.toLowerCase();
                t.classList.toggle('hidden', q && !text.includes(q));
            });
            document.querySelectorAll('.phase').forEach(p => {
                const visible = p.querySelectorAll('.topic:not(.hidden)').length > 0;
                p.classList.toggle('hidden', q && !visible);
            });
        }

        function renderRoadmap() {
            const container = document.getElementById('roadmap');
            const state = loadState();
            let totalTopics = 0, doneTopics = 0;
            let html = '';

            ROADMAP.forEach((phase, pi) => {
                const key = 'phase' + phase.phase;
                html += `<div class="phase ${phase.class}">`;
                html += `<div class="phase-header"><span class="phase-title"><span class="num">Phase ${phase.phase}</span>${phase.label}</span><span class="phase-count">${phase.topics.length} chủ đề</span></div>`;

                phase.topics.forEach((topic, ti) => {
                    const id = key + '-' + ti;
                    const checked = state[id] || false;
                    if (checked) doneTopics++;
                    totalTopics++;

                    const checkClass = checked ? 'topic-check checked' : 'topic-check';
                    const topicClass = checked ? 'topic done' : 'topic';
                    const hasFiles = topic.files && topic.files.length > 0;
                    const filesHtml = hasFiles ? topic.files.map(f => '<li>' + f + '</li>').join('') : '<li>Không tìm thấy file phù hợp. Tìm trong thư mục gốc.</li>';

                    html += `<div class="${topicClass}">`;
                    html += `<div class="topic-main">`;
                    html += `<span class="${checkClass}" onclick="event.stopPropagation(); toggleCheck('${id}')">${checked ? '✓' : ''}</span>`;
                    html += `<span class="topic-label" onclick="toggleFiles('${id}')">${topic.label}</span>`;
                    if (topic.tag) html += `<span class="topic-tag">${topic.tag}</span>`;
                    html += `<span class="topic-goal">${topic.goal}</span>`;
                    html += `<span class="topic-arrow" id="arrow-${id}" onclick="toggleFiles('${id}')">▾</span>`;
                    html += `</div>`;
                    html += `<div class="topic-files" id="files-${id}"><ul>${filesHtml}</ul></div>`;
                    html += `</div>`;
                });
                html += `</div>`;
            });

            container.innerHTML = html;
            updateProgress(doneTopics, totalTopics);
        }

        function updateProgress(done, total) {
            const pct = total > 0 ? Math.round(done / total * 100) : 0;
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressCount').textContent = done + '/' + total;
            document.getElementById('progressPercent').textContent = pct + '%';
        }

        function resetAll() {
            if (confirm('Reset toàn bộ tiến độ?')) {
                localStorage.removeItem(STORAGE_KEY);
                renderRoadmap();
            }
        }

        renderRoadmap();
    </script>
</body>
</html>
